name: Update README stats cards

on:
  schedule:
    - cron: "17 6 * * *" # once a day
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=InvictusYing&show_icons=true&count_private=true&bg_color=30,0ff1ce,904e95&title_color=fff&text_color=fff&icon_color=fff&ring_color=fff
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=InvictusYing&layout=compact&langs_count=8&card_width=320&count_private=true&hide=jupyter%20notebook,html&bg_color=30,0ff1ce,904e95&title_color=fff&text_color=fff
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update stats cards"
          git push
